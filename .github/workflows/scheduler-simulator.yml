name: Scheduler simulator

on:
  push:
    branches: [main, 'experiment/**']
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"

permissions:
  contents: read

jobs:
  java-25:
    name: Compile and smoke-test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile with Java 25
        run: |
          mkdir -p build/scheduler-sim
          javac --release 25 -Xlint:all -Werror \
            -d build/scheduler-sim \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/ContextSweep.java

      - name: Run deterministic smoke test
        shell: bash
        run: |
          set -euo pipefail
          command=(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.25 20000 42 2 128)
          first="$( "${command[@]}" )"
          second="$( "${command[@]}" )"
          test "$first" = "$second"
          grep -q 'contexts=512' <<< "$first"
          grep -q 'issueWidth=4' <<< "$first"
          grep -q 'maxOutstanding=2' <<< "$first"
          grep -q 'memoryQueueCapacity=128' <<< "$first"
          grep -q 'seed=42' <<< "$first"
          printf '%s\n' "$first"

      - name: Verify single-outstanding compatibility
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          legacy="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7)"
          explicit="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7 1)"
          test "$legacy" = "$explicit"

      - name: Sweep context count and per-thread outstanding limits
        run: |
          for outstanding in 1 2 4 8; do
            for contexts in 64 128 256 512; do
              java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep "$contexts" 4 300 0.25 200000 42 "$outstanding"
            done
          done

      - name: Exercise multi-class finite-queue and dependency model
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 1024 4 300 0.25 100000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'memoryClass=L1' <<< "$output"
          grep -q 'memoryClass=L2' <<< "$output"
          grep -q 'memoryClass=DRAM' <<< "$output"
          grep -q 'dependencyFraction=0.100' <<< "$output"
          grep -Eq 'dependencyIssues=[1-9][0-9]*' <<< "$output"
          printf '%s\n' "$output"

      - name: Verify finite queue backpressure
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.50 50000 19 4 8 0.70 4 0.20 20 200)"
          grep -q 'memoryQueueCapacity=8' <<< "$output"
          grep -Eq 'queueFullStalls=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, pair, "="); if (pair[1] == "maxQueueOccupancy" && pair[2] > 8) exit 1; } }' <<< "$output"

      - name: Verify invalid arguments fail
        shell: bash
        run: |
          set -euo pipefail
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep; then
            echo "Expected invalid invocation to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 1 8 0.70 4 0.20 20 200 1.5 12; then
            echo "Expected invalid dependency fraction to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 0; then
            echo "Expected max-outstanding=0 to fail" >&2
            exit 1
          fi
