<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
<title id="title">fNx architecture family overview</title>
<desc id="desc">A family of native-width processors sharing one ISA and communicating through a width-neutral hierarchical fabric, with memory, I/O, and independent platform management.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#101f38"/></linearGradient>
  <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123d5b"/><stop offset=".5" stop-color="#15556a"/><stop offset="1" stop-color="#123d5b"/></linearGradient>
  <linearGradient id="isa" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#392c68"/><stop offset="1" stop-color="#254d70"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".38"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71d7d0"/></marker>
  <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ca4c4"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .eyebrow{font-size:16px;font-weight:700;letter-spacing:3px;fill:#82d8d1}
    .h1{font-size:48px;font-weight:750;letter-spacing:-1px;fill:#f4f7ff}
    .sub{font-size:21px;fill:#aabbd2}
    .section{font-size:17px;font-weight:750;letter-spacing:2.5px;fill:#8fa6c4}
    .cardTitle{font-size:25px;font-weight:750;fill:#f4f7ff}
    .cardSub{font-size:16px;fill:#b7c7dc}
    .small{font-size:15px;fill:#aabbd2}
    .tiny{font-size:13px;fill:#91a6c0}
    .white{fill:#f4f7ff}
    .teal{fill:#82e0d5}
    .amber{fill:#ffc77d}
    .purple{fill:#c5b5ff}
    .panel{fill:#13243c;stroke:#2b4261;stroke-width:1.5}
    .node{fill:#1a304d;stroke:#3b5b7c;stroke-width:1.5}
    .line{fill:none;stroke:#71d7d0;stroke-width:3;marker-end:url(#arrow)}
    .control{fill:none;stroke:#e6b56f;stroke-width:2.5;stroke-dasharray:8 8;marker-end:url(#arrowMuted)}
  </style>
</defs>
<rect width="1800" height="1120" rx="28" fill="url(#bg)"/>
<circle cx="1570" cy="90" r="240" fill="#19365a" opacity=".18"/><circle cx="170" cy="1010" r="250" fill="#174e59" opacity=".12"/>
<text x="92" y="76" class="eyebrow">ARCHITECTURE FAMILY · OVERVIEW 0.1</text>
<text x="92" y="137" class="h1">One architecture. Native width at every scale.</text>
<text x="94" y="178" class="sub">fNx defines a common instruction and platform contract across width-specific processor members.</text>

<text x="94" y="238" class="section">01 / NATIVE-WIDTH PROCESSOR FAMILY</text>
<text x="1705" y="238" text-anchor="end" class="tiny">Each CPU architectural unit implements exactly one native width</text>

<g filter="url(#shadow)">
  <rect x="92" y="265" width="216" height="126" rx="18" class="node"/>
  <rect x="326" y="265" width="216" height="126" rx="18" class="node"/>
  <rect x="560" y="265" width="216" height="126" rx="18" class="node"/>
  <rect x="794" y="265" width="216" height="126" rx="18" class="node"/>\n  <rect x="798" y="269" width="208" height="118" rx="14" fill="none" stroke="#ffc77d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="1028" y="265" width="216" height="126" rx="18" class="node"/>
  <rect x="1262" y="265" width="216" height="126" rx="18" class="node"/>
  <rect x="1496" y="265" width="212" height="126" rx="18" class="node"/>
</g>
<g text-anchor="middle">
  <text x="200" y="316" class="cardTitle">f16x</text><text x="200" y="349" class="cardSub">16-bit native width</text>
  <text x="434" y="316" class="cardTitle">f32x</text><text x="434" y="349" class="cardSub">32-bit native width</text>
  <text x="668" y="316" class="cardTitle">f64x</text><text x="668" y="349" class="cardSub">64-bit native width</text>
  <text x="902" y="310" class="cardTitle">128-bit member</text><text x="902" y="340" class="cardSub">128-bit native width</text><text x="902" y="370" class="tiny" style="fill:#ffc77d;font-weight:750">NAMING TBD</text>
  <text x="1136" y="316" class="cardTitle">f256x</text><text x="1136" y="349" class="cardSub">256-bit native width</text>
  <text x="1370" y="316" class="cardTitle">f512x</text><text x="1370" y="349" class="cardSub">512-bit native width</text>
  <text x="1602" y="316" class="cardTitle">f1024x</text><text x="1602" y="349" class="cardSub">1024-bit native width</text>
</g>
<path d="M200 392 V425 H1602 V392 M902 425 V451" class="line"/>
<rect x="275" y="452" width="1250" height="100" rx="20" fill="url(#isa)" stroke="#7869ad" stroke-width="1.5" filter="url(#shadow)"/>
<text x="900" y="491" text-anchor="middle" class="eyebrow" style="fill:#d0c5ff">ONE SHARED ISA</text>
<text x="900" y="525" text-anchor="middle" class="white" style="font-size:23px;font-weight:650">Common opcode registry · consistent instruction semantics · common privilege and exception model</text>

<path d="M900 553 V589" class="line"/>
<rect x="170" y="590" width="1460" height="132" rx="22" fill="url(#fabric)" stroke="#3d9e9c" stroke-width="1.8" filter="url(#shadow)"/>
<text x="900" y="630" text-anchor="middle" class="eyebrow">WIDTH-NEUTRAL SYSTEM FABRIC</text>
<text x="900" y="666" text-anchor="middle" class="white" style="font-size:27px;font-weight:750">Interoperability without mixed-width CPU units</text>
<text x="900" y="697" text-anchor="middle" class="cardSub">Byte-addressed transactions · explicit lengths · ordering and completion · capability negotiation · hierarchical routing</text>

<text x="94" y="777" class="section">02 / SYSTEM COMPOSITION</text>
<g filter="url(#shadow)">
  <rect x="92" y="803" width="1050" height="225" rx="20" class="panel"/>
  <rect x="1170" y="803" width="538" height="225" rx="20" class="panel"/>
</g>
<text x="126" y="845" class="eyebrow">COMPUTE, MEMORY &amp; I/O</text>
<rect x="128" y="871" width="300" height="112" rx="14" class="node"/>
<rect x="454" y="871" width="300" height="112" rx="14" class="node"/>
<rect x="780" y="871" width="326" height="112" rx="14" class="node"/>
<text x="278" y="910" text-anchor="middle" class="cardTitle">CPU boards</text>
<text x="278" y="940" text-anchor="middle" class="cardSub">One native-width member</text>
<text x="278" y="963" text-anchor="middle" class="small">per CPU unit</text>
<text x="604" y="910" text-anchor="middle" class="cardTitle">Memory</text>
<text x="604" y="940" text-anchor="middle" class="cardSub">Local and optional shared</text>
<text x="604" y="963" text-anchor="middle" class="small">placement is implementation-defined</text>
<text x="943" y="910" text-anchor="middle" class="cardTitle">I/O boards</text>
<text x="943" y="940" text-anchor="middle" class="cardSub">Storage · networking · devices</text>
<text x="943" y="963" text-anchor="middle" class="small">protocol adapters</text>
<path d="M278 871 V744 H900 M604 871 V744 M943 871 V744" fill="none" stroke="#71d7d0" stroke-width="2.5" opacity=".75"/>
<text x="1204" y="845" class="eyebrow" style="fill:#ffc77d">INDEPENDENT CONTROL PLANE</text>
<rect x="1205" y="871" width="468" height="112" rx="14" fill="#382f2b" stroke="#a97848" stroke-width="1.5"/>
<text x="1439" y="910" text-anchor="middle" class="cardTitle">FCP</text>
<text x="1439" y="940" text-anchor="middle" class="cardSub">Discovery · power/reset · thermal</text>
<text x="1439" y="963" text-anchor="middle" class="small">telemetry · faults · fabric coordination</text>
<path d="M1439 871 V752 H1600 V722" class="control"/>
<text x="94" y="1072" class="small">Architectural contract shown; physical topology, capacities, and microarchitecture remain implementation choices.</text>
<text x="1708" y="1072" text-anchor="end" class="tiny">fNx · WORKING DIRECTION · 2026-11-05</text>
</svg>
