name: Scheduler simulator

on:
  push:
    branches: [main, 'experiment/**']
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"

permissions:
  contents: read

jobs:
  java-25:
    name: Compile and smoke-test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile with Java 25
        run: |
          mkdir -p build/scheduler-sim
          javac --release 25 -Xlint:all -Werror \
            -d build/scheduler-sim \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/ContextSweep.java \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/MemoryAddressing.java \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/BoardFabricSweep.java \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/CacheSweep.java

      - name: Test deterministic address generation and mapping
        shell: bash
        run: |
          set -euo pipefail
          javac --release 25 -Xlint:all -Werror -cp build/scheduler-sim \
            -d build/scheduler-sim \
            tools/scheduler-sim/src/test/java/org/flossware/f128x/sim/MemoryAddressingTest.java
          java -cp build/scheduler-sim org.flossware.f128x.sim.MemoryAddressingTest
          class=org.flossware.f128x.sim.ContextSweep
          for pattern in random sequential strided shared_region; do
            output="$(java -Df128x.addressPattern="$pattern" -Df128x.memoryChannels=4 -Df128x.memoryBanksPerChannel=8 -cp build/scheduler-sim "$class" 64 4 80 0.50 10000 42 4 128)"
            grep -q "addressPattern=$pattern" <<< "$output"
          done
          low="$(java -Df128x.addressPattern=strided -Df128x.addressStride=8192 -Df128x.addressMapping=low_order -Df128x.memoryChannels=4 -Df128x.memoryBanksPerChannel=8 -cp build/scheduler-sim "$class" 64 4 80 0.50 10000 42 4 128)"
          xor="$(java -Df128x.addressPattern=strided -Df128x.addressStride=8192 -Df128x.addressMapping=xor -Df128x.memoryChannels=4 -Df128x.memoryBanksPerChannel=8 -cp build/scheduler-sim "$class" 64 4 80 0.50 10000 42 4 128)"
          grep -q 'addressMapping=low_order' <<< "$low"
          grep -q 'addressMapping=xor' <<< "$xor"
          if java -Df128x.addressPattern=unknown -cp build/scheduler-sim "$class" 64 4 80 0.50 1000 42; then
            echo "Expected unknown address pattern to fail" >&2
            exit 1
          fi
          if java -Df128x.addressStride=0 -cp build/scheduler-sim "$class" 64 4 80 0.50 1000 42; then
            echo "Expected non-positive address stride to fail" >&2
            exit 1
          fi

      - name: Test synthetic cache hierarchy
        shell: bash
        run: |
          set -euo pipefail
          javac --release 25 -Xlint:all -Werror -cp build/scheduler-sim \
            -d build/scheduler-sim \
            tools/scheduler-sim/src/test/java/org/flossware/f128x/sim/CacheSweepTest.java
          java -cp build/scheduler-sim org.flossware.f128x.sim.CacheSweepTest
          class=org.flossware.f128x.sim.CacheSweep
          sequential="$(java -Df128x.addressPattern=sequential -cp build/scheduler-sim "$class" 4 20000 4096 42)"
          random="$(java -Df128x.addressPattern=random -cp build/scheduler-sim "$class" 4 20000 4194304 42)"
          shared="$(java -Df128x.addressPattern=shared_region -Df128x.addressStride=64 -cp build/scheduler-sim "$class" 4 20000 65536 42)"
          grep -q 'cacheModel=private-l1-shared-l2' <<< "$sequential"
          grep -Eq 'measuredL1Hits=[1-9][0-9]*' <<< "$sequential"
          grep -Eq 'measuredL2Hits=[1-9][0-9]*' <<< "$shared"
          grep -Eq 'measuredDramMisses=[1-9][0-9]*' <<< "$random"
          printf '%s\n' "$sequential"
          printf '%s\n' "$random"
          printf '%s\n' "$shared"
      - name: Exercise cache hierarchy in scheduler
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -Df128x.cache.enabled=true -Df128x.addressPattern=shared_region -Df128x.addressStride=64 -Df128x.addressRegionBytes=4096 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 200 0.25 20000 42 16 128)"
          grep -q 'cacheHierarchyEnabled=true' <<< "$output"
          grep -q '^memoryClass=L1 ' <<< "$output"
          grep -q '^memoryClass=L2 ' <<< "$output"
          grep -q '^memoryClass=DRAM ' <<< "$output"
          printf '%s\n' "$output"
      - name: Verify cache hits bypass DRAM bank service
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -Df128x.cache.enabled=true -Df128x.addressPattern=shared_region -Df128x.addressStride=64 -Df128x.addressRegionBytes=4096 -Df128x.memoryChannels=4 -Df128x.memoryBanksPerChannel=8 -Df128x.memoryBandwidthBytesPerCycle=16 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 200 0.25 20000 42 16 128)"
          grep -q 'cacheHierarchyEnabled=true' <<< "$output"
          grep -q 'memorySystemEnabled=true' <<< "$output"
          grep -Eq 'memoryBankRequests=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="memoryBankRequests") bank=p[2]; if (p[1]=="memoryIssues") issues=p[2]; } } END { if (bank >= issues) exit 1; }' <<< "$output"
          printf '%s\\n' "$output"

      - name: Exercise modular board and backplane model
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.BoardFabricSweep
          options=(-Df128x.contexts=256 -Df128x.workspaces=16 -Df128x.cycles=4000 -Df128x.warmup=400 -Df128x.seed=42)
          first="$(java "${options[@]}" -cp build/scheduler-sim "$class")"
          second="$(java "${options[@]}" -cp build/scheduler-sim "$class")"
          test "$first" = "$second"
          grep -q 'boards=1 clustersPerBoard=8 issueWidthPerCluster=1 aggregateIssueWidth=8' <<< "$first"
          grep -q 'boards=2 clustersPerBoard=4 issueWidthPerCluster=1 aggregateIssueWidth=8' <<< "$first"
          grep -q 'boards=4 clustersPerBoard=2 issueWidthPerCluster=1 aggregateIssueWidth=8' <<< "$first"
          grep -q 'boards=8 clustersPerBoard=1 issueWidthPerCluster=1 aggregateIssueWidth=8' <<< "$first"
          grep -q 'boards=4 clustersPerBoard=4 issueWidthPerCluster=1 aggregateIssueWidth=16' <<< "$first"
          grep -Eq 'remoteRequests=[1-9][0-9]*' <<< "$first"
          grep -Eq 'fabricBytes=[1-9][0-9]*' <<< "$first"
          grep -q 'remoteFraction=0.10' <<< "$first"
          grep -q 'remoteFraction=0.50' <<< "$first"
          grep -q 'remoteFraction=0.90' <<< "$first"
          printf '%s\n' "$first"

      - name: Exercise local-memory lanes and remote-access patterns
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.BoardFabricSweep
          options=(-Df128x.contexts=256 -Df128x.workspaces=16 -Df128x.cycles=4000 -Df128x.warmup=400 -Df128x.seed=42)
          for pattern in uniform hotspot paired; do
            first="$(java "${options[@]}" -Df128x.localMemoryLanesPerBoard=4 -Df128x.remotePattern="$pattern" -cp build/scheduler-sim "$class")"
            second="$(java "${options[@]}" -Df128x.localMemoryLanesPerBoard=4 -Df128x.remotePattern="$pattern" -cp build/scheduler-sim "$class")"
            test "$first" = "$second"
            grep -q 'localMemoryLanesPerBoard=4' <<< "$first"
            grep -q "remotePattern=$pattern" <<< "$first"
            grep -Eq 'remoteRequests=[1-9][0-9]*' <<< "$first"
            grep -Eq 'boardRemoteRequests=0:[1-9][0-9]*' <<< "$first"
            if [[ "$pattern" == hotspot ]]; then
              grep -Eq 'boardRemoteRequests=0:[1-9][0-9]*,1:[1-9][0-9]*,2:0,3:0' <<< "$first"
            elif [[ "$pattern" == paired ]]; then
              grep -Eq 'boardRemoteRequests=0:[1-9][0-9]*,1:[1-9][0-9]*,2:[1-9][0-9]*,3:[1-9][0-9]*' <<< "$first"
            fi
          done

      - name: Run full switched-fabric topology sensitivity matrix
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.FabricTopologySweep)"
          lines="$(grep -c '^fabricTopology=' <<< "$output")"
          test "$lines" -eq 81
          grep -q 'topology=shared' <<< "$output"
          grep -q 'topology=ring' <<< "$output"
          grep -q 'topology=mesh' <<< "$output"
          grep -q 'boards=4' <<< "$output"
          grep -q 'boards=8' <<< "$output"
          grep -q 'boards=16' <<< "$output"
          grep -q 'remotePattern=uniform' <<< "$output"
          grep -q 'remotePattern=hotspot' <<< "$output"
          grep -q 'remotePattern=paired' <<< "$output"
          grep -q 'parallelLinks=1' <<< "$output"
          grep -q 'parallelLinks=2' <<< "$output"
          grep -q 'parallelLinks=4' <<< "$output"
          printf '%s\\n' "$output"
          echo "PASS: full 81-case switched-fabric topology matrix"

      - name: Run deterministic smoke test
        shell: bash
        run: |
          set -euo pipefail
          command=(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.25 20000 42 2 128)
          first="$( "${command[@]}" )"
          second="$( "${command[@]}" )"
          test "$first" = "$second"
          grep -q 'contexts=512' <<< "$first"
          grep -q 'issueWidth=4' <<< "$first"
          grep -q 'maxOutstanding=2' <<< "$first"
          grep -q 'memoryQueueCapacity=128' <<< "$first"
          grep -q 'seed=42' <<< "$first"
          printf '%s\n' "$first"

      - name: Verify single-outstanding compatibility
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          legacy="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7)"
          explicit="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7 1)"
          test "$legacy" = "$explicit"

      - name: Sweep context count and per-thread outstanding limits
        run: |
          for outstanding in 1 2 4 8; do
            for contexts in 64 128 256 512; do
              java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep "$contexts" 4 300 0.25 200000 42 "$outstanding"
            done
          done

      - name: Repeat MLP sweep across deterministic seeds
        run: |
          for seed in 1 7 42 101; do
            for outstanding in 1 2 4 8; do
              for contexts in 64 128 256 512; do
                java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep "$contexts" 4 300 0.25 100000 "$seed" "$outstanding"
              done
            done
          done

      - name: Exercise multi-class finite-queue and dependency model
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 1024 4 300 0.25 100000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'memoryClass=L1' <<< "$output"
          grep -q 'memoryClass=L2' <<< "$output"
          grep -q 'memoryClass=DRAM' <<< "$output"
          grep -q 'dependencyFraction=0.100' <<< "$output"
          grep -Eq 'dependencyIssues=[1-9][0-9]*' <<< "$output"
          printf '%s\n' "$output"

      - name: Compare scheduler topologies
        shell: bash
        run: |
          set -euo pipefail
          for scheduler in fifo hierarchical distributed; do
            output="$(java -Df128x.scheduler="$scheduler" -Df128x.clusters=8 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 1024 4 300 0.25 50000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
            grep -q "scheduler=$scheduler" <<< "$output"
            grep -Eq 'workspaceIssueJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableThreadCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableThreadCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableWorkspaceCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableWorkspaceCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            printf '%s\n' "$output"
          done
          sparse="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 20000 42 2)"
          grep -Eq 'schedulerSteals=[1-9][0-9]*' <<< "$sparse"
          printf '%s\n' "$sparse"

      - name: Compare schedulers under workspace workload skew
        shell: bash
        run: |
          set -euo pipefail
          for scheduler in fifo hierarchical distributed; do
            output="$(java -Df128x.scheduler="$scheduler" -Df128x.clusters=2 -Df128x.hotWorkspaceRatio=0.25 -Df128x.hotMemoryFraction=0.90 -Df128x.coldMemoryFraction=0.05 -Df128x.hotDependencyFraction=0.20 -Df128x.coldDependencyFraction=0.02 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 50000 42 2)"
            grep -q "scheduler=$scheduler" <<< "$output"
            grep -q 'hotWorkspaceCount=1' <<< "$output"
            grep -Eq 'workspaceIssueJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableThreadCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableThreadCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableWorkspaceCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableWorkspaceCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            printf '%s\n' "$output"
          done

      - name: Verify per-cluster issue budgets and global capacity
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          capped="$(java -Df128x.scheduler=distributed -Df128x.clusters=2 -Df128x.clusterIssueWidth=1 -cp build/scheduler-sim "$class" 1024 4 300 0.25 20000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'clusterIssueWidth=1 effectiveIssueCapacity=2' <<< "$capped"
          grep -q 'clusterBudgetUtilization=1.0000' <<< "$capped"
          awk '/^scheduler=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="measuredIPC" && p[2]>2.0001) exit 1; } }' <<< "$capped"
          awk -v limit=20000 '/^clusterIssueCount=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="issues" && p[2]>limit) exit 1; } }' <<< "$capped"
          printf '%s\n' "$capped"
          full="$(java -Df128x.scheduler=distributed -Df128x.clusters=4 -Df128x.clusterIssueWidth=2 -cp build/scheduler-sim "$class" 1024 4 300 0.25 50000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'clusterIssueWidth=2 effectiveIssueCapacity=4' <<< "$full"
          grep -q 'measuredIPC=4.0000' <<< "$full"
          grep -q 'clusterBudgetUtilization=1.0000' <<< "$full"
          awk -v limit=100000 '/^clusterIssueCount=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="issues" && p[2]>limit) exit 1; } }' <<< "$full"
          printf '%s\n' "$full"

      - name: Verify migration and remote-locality penalties
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          output="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=3 -Df128x.remoteMemoryLatencyPenalty=7 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -q 'migrationLatency=3 remoteMemoryLatencyPenalty=7' <<< "$output"
          grep -Eq 'schedulerMigrations=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteWakeups=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteThreadCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteMemoryIssues=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteMemoryLatencyCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'migrationWaiterCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'migrationCompletions=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="schedulerMigrations") migrations=p[2]; if (p[1]=="schedulerSteals") steals=p[2]; if (p[1]=="remoteMemoryIssues") remote=p[2]; if (p[1]=="remoteMemoryLatencyCycles") penalty=p[2]; } } END { if (migrations != steals || penalty != remote * 7) exit 1; }' <<< "$output"
          printf '%s\n' "$output"
          baseline="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=0 -Df128x.remoteMemoryLatencyPenalty=0 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -q 'migrationLatency=0 remoteMemoryLatencyPenalty=0' <<< "$baseline"
          grep -q 'migrationWaiterCycles=0' <<< "$baseline"
          grep -q 'migrationCompletions=0' <<< "$baseline"
          grep -q 'remoteMemoryLatencyCycles=0' <<< "$baseline"
          printf '%s\n' "$baseline"
          migration_only="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=3 -Df128x.remoteMemoryLatencyPenalty=0 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -Eq 'migrationWaiterCycles=[1-9][0-9]*' <<< "$migration_only"
          grep -q 'remoteMemoryLatencyCycles=0' <<< "$migration_only"
          printf '%s\n' "$migration_only"
          locality_only="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=0 -Df128x.remoteMemoryLatencyPenalty=7 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -q 'migrationWaiterCycles=0' <<< "$locality_only"
          grep -Eq 'remoteMemoryLatencyCycles=[1-9][0-9]*' <<< "$locality_only"
          printf '%s\n' "$locality_only"

      - name: Verify byte bandwidth and bank contention
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          baseline="$(java -cp build/scheduler-sim "$class" 512 4 300 0.50 30000 19 4 128 0.70 4 0.20 20 200)"
          bounded="$(java -Df128x.memoryRequestBytes=64 -Df128x.memoryChannels=4 -Df128x.memoryBanksPerChannel=8 -Df128x.memoryBandwidthBytesPerCycle=16 -Df128x.bankConflictPenalty=2 -cp build/scheduler-sim "$class" 512 4 300 0.50 30000 19 4 128 0.70 4 0.20 20 200)"
          echo "$bounded"
          check() {
            local label="$1" pattern="$2" output="$3"
            if ! grep -Eq "$pattern" <<< "$output"; then
              echo "FAIL: $label" >&2
              exit 1
            fi
          }
          check "memory system enabled with 64-byte requests" 'memorySystemEnabled=true cacheHierarchyEnabled=false memoryRequestBytes=64 memoryRequestBytesMin=64 memoryRequestBytesMax=64' "$bounded"
          check "four-channel/eight-bank configuration" 'memoryChannels=4 memoryBanksPerChannel=8' "$bounded"
          check "configured bandwidth and bank penalty" 'memoryBandwidthBytesPerCycle=16 aggregateMemoryBandwidthBytesPerCycle=64 bankConflictPenalty=2' "$bounded"
          check "bank conflicts observed" 'bankConflictRequests=[1-9][0-9]*' "$bounded"
          check "bank conflict wait observed" 'bankConflictWaitCycles=[1-9][0-9]*' "$bounded"
          check "DRAM service cycles observed" 'memoryServiceCycles=[1-9][0-9]*' "$bounded"
          check "bank outstanding observed" 'maxBankOutstanding=[1-9][0-9]*' "$bounded"
          check "memory byte counters reported" 'memoryBytesIssued=[1-9][0-9]* memoryBytesCompleted=[0-9]+' "$bounded"
          check "DRAM bank requests reported" 'memoryBankRequests=[1-9][0-9]*' "$bounded"
          echo "PASS: byte bandwidth and bank contention checks"
 
      - name: Verify independent dependency chains
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          single="$(java -Df128x.dependencyChains=1 -cp build/scheduler-sim "$class" 8 4 300 0.0 50000 42 1 128 0.70 4 0.20 20 200 0.50 12)"
          parallel="$(java -Df128x.dependencyChains=4 -cp build/scheduler-sim "$class" 8 4 300 0.0 50000 42 1 128 0.70 4 0.20 20 200 0.50 12)"
          grep -q 'dependencyChains=1' <<< "$single"
          grep -q 'dependencyIssuesOverlapped=0' <<< "$single"
          grep -q 'dependencyChains=4' <<< "$parallel"
          grep -Eq 'dependencyIssuesOverlapped=[1-9][0-9]*' <<< "$parallel"
          awk -v single="$single" '{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="measuredIPC") parallel=p[2]; } } END { for (i=1; i<=split(single, fields, " "); i++) { split(fields[i], p, "="); if (p[1]=="measuredIPC") baseline=p[2]; } if (parallel <= baseline) exit 1; }' <<< "$parallel"
          printf '%s\n' "$single"
          printf '%s\n' "$parallel"

      - name: Verify memory completion-rate backpressure
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.50 50000 19 4 128 0.70 4 0.20 20 200 1)"
          grep -q 'memoryCompletionRate=1' <<< "$output"
          grep -Eq 'serviceBacklogCycles=[1-9][0-9]*' <<< "$output"
          printf '%s\n' "$output"

      - name: Verify finite queue backpressure
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.50 50000 19 4 8 0.70 4 0.20 20 200)"
          grep -q 'memoryQueueCapacity=8' <<< "$output"
          grep -Eq 'queueFullAttempts=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, pair, "="); if (pair[1] == "maxQueueOccupancy" && pair[2] > 8) exit 1; } }' <<< "$output"
          printf '%s\n' "$output"

      - name: Verify invalid arguments fail
        shell: bash
        run: |
          set -euo pipefail
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep; then
            echo "Expected invalid invocation to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 1 8 0.70 4 0.20 20 200 1.5 12; then
            echo "Expected invalid dependency fraction to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 1 8 0.70 4 0.20 20 200 0; then
            echo "Expected invalid completion rate to fail" >&2
            exit 1
          fi
          if java -Df128x.hotMemoryFraction=NaN -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected non-finite workspace memory fraction to fail" >&2
            exit 1
          fi
          if java -Df128x.migrationLatency=-1 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected negative migration latency to fail" >&2
            exit 1
          fi
          if java -Df128x.remoteMemoryLatencyPenalty=-1 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected negative remote-memory penalty to fail" >&2
            exit 1
          fi
