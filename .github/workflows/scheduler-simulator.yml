name: fNx scheduler simulator

on:
  push:
    paths: ["tools/scheduler-sim/**", ".github/workflows/scheduler-simulator.yml"]
  pull_request:
    paths: ["tools/scheduler-sim/**", ".github/workflows/scheduler-simulator.yml"]
  workflow_dispatch:

jobs:
  java-25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Compile simulator
        run: |
          set -euo pipefail
          mkdir -p build/scheduler-sim
          mapfile -t sources < <(find tools/scheduler-sim/src -name '*.java' -type f | sort)
          javac --release 25 -d build/scheduler-sim "${sources[@]}"
      - name: Run simulator tests
        run: |
          set -euo pipefail
          java -cp build/scheduler-sim org.flossware.fnx.sim.MemoryAddressingTest
          java -cp build/scheduler-sim org.flossware.fnx.sim.CacheSweepTest
      - name: Run scheduler and fabric smoke tests
        run: |
          set -euo pipefail
          java -cp build/scheduler-sim org.flossware.fnx.sim.ContextSweep 512 4 300 0.25 20000 42 2 128
          java -cp build/scheduler-sim org.flossware.fnx.sim.BoardFabricSweep
          java -cp build/scheduler-sim org.flossware.fnx.sim.FabricTopologySweep
