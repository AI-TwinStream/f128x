name: Scheduler simulator

on:
  push:
    branches: [main, 'experiment/**']
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/scheduler-sim/**"
      - ".github/workflows/scheduler-simulator.yml"

permissions:
  contents: read

jobs:
  java-25:
    name: Compile and smoke-test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile with Java 25
        run: |
          mkdir -p build/scheduler-sim
          javac --release 25 -Xlint:all -Werror \
            -d build/scheduler-sim \
            tools/scheduler-sim/src/main/java/org/flossware/f128x/sim/ContextSweep.java

      - name: Run deterministic smoke test
        shell: bash
        run: |
          set -euo pipefail
          command=(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.25 20000 42 2 128)
          first="$( "${command[@]}" )"
          second="$( "${command[@]}" )"
          test "$first" = "$second"
          grep -q 'contexts=512' <<< "$first"
          grep -q 'issueWidth=4' <<< "$first"
          grep -q 'maxOutstanding=2' <<< "$first"
          grep -q 'memoryQueueCapacity=128' <<< "$first"
          grep -q 'seed=42' <<< "$first"
          printf '%s\n' "$first"

      - name: Verify single-outstanding compatibility
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          legacy="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7)"
          explicit="$(java -cp build/scheduler-sim "$class" 128 2 100 0.25 5000 7 1)"
          test "$legacy" = "$explicit"

      - name: Sweep context count and per-thread outstanding limits
        run: |
          for outstanding in 1 2 4 8; do
            for contexts in 64 128 256 512; do
              java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep "$contexts" 4 300 0.25 200000 42 "$outstanding"
            done
          done

      - name: Repeat MLP sweep across deterministic seeds
        run: |
          for seed in 1 7 42 101; do
            for outstanding in 1 2 4 8; do
              for contexts in 64 128 256 512; do
                java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep "$contexts" 4 300 0.25 100000 "$seed" "$outstanding"
              done
            done
          done

      - name: Exercise multi-class finite-queue and dependency model
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 1024 4 300 0.25 100000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'memoryClass=L1' <<< "$output"
          grep -q 'memoryClass=L2' <<< "$output"
          grep -q 'memoryClass=DRAM' <<< "$output"
          grep -q 'dependencyFraction=0.100' <<< "$output"
          grep -Eq 'dependencyIssues=[1-9][0-9]*' <<< "$output"
          printf '%s\n' "$output"

      - name: Compare scheduler topologies
        shell: bash
        run: |
          set -euo pipefail
          for scheduler in fifo hierarchical distributed; do
            output="$(java -Df128x.scheduler="$scheduler" -Df128x.clusters=8 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 1024 4 300 0.25 50000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
            grep -q "scheduler=$scheduler" <<< "$output"
            grep -Eq 'workspaceIssueJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableThreadCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableThreadCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableWorkspaceCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableWorkspaceCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            printf '%s\n' "$output"
          done
          sparse="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 20000 42 2)"
          grep -Eq 'schedulerSteals=[1-9][0-9]*' <<< "$sparse"
          printf '%s\n' "$sparse"

      - name: Compare schedulers under workspace workload skew
        shell: bash
        run: |
          set -euo pipefail
          for scheduler in fifo hierarchical distributed; do
            output="$(java -Df128x.scheduler="$scheduler" -Df128x.clusters=2 -Df128x.hotWorkspaceRatio=0.25 -Df128x.hotMemoryFraction=0.90 -Df128x.coldMemoryFraction=0.05 -Df128x.hotDependencyFraction=0.20 -Df128x.coldDependencyFraction=0.02 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 50000 42 2)"
            grep -q "scheduler=$scheduler" <<< "$output"
            grep -q 'hotWorkspaceCount=1' <<< "$output"
            grep -Eq 'workspaceIssueJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableThreadCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableThreadCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            grep -Eq 'workspaceRunnableWorkspaceCycles=[1-9][0-9]*' <<< "$output"
            grep -Eq 'workspaceIssuePerRunnableWorkspaceCycleJainFairness=[01]\.[0-9]+' <<< "$output"
            printf '%s\n' "$output"
          done

      - name: Verify per-cluster issue budgets and global capacity
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          capped="$(java -Df128x.scheduler=distributed -Df128x.clusters=2 -Df128x.clusterIssueWidth=1 -cp build/scheduler-sim "$class" 1024 4 300 0.25 20000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'clusterIssueWidth=1 effectiveIssueCapacity=2' <<< "$capped"
          grep -q 'clusterBudgetUtilization=1.0000' <<< "$capped"
          awk '/^scheduler=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="measuredIPC" && p[2]>2.0001) exit 1; } }' <<< "$capped"
          awk -v limit=20000 '/^clusterIssueCount=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="issues" && p[2]>limit) exit 1; } }' <<< "$capped"
          printf '%s\n' "$capped"
          full="$(java -Df128x.scheduler=distributed -Df128x.clusters=4 -Df128x.clusterIssueWidth=2 -cp build/scheduler-sim "$class" 1024 4 300 0.25 50000 42 4 128 0.70 4 0.20 20 200 0.10 12)"
          grep -q 'clusterIssueWidth=2 effectiveIssueCapacity=4' <<< "$full"
          grep -q 'measuredIPC=4.0000' <<< "$full"
          grep -q 'clusterBudgetUtilization=1.0000' <<< "$full"
          awk -v limit=100000 '/^clusterIssueCount=/{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="issues" && p[2]>limit) exit 1; } }' <<< "$full"
          printf '%s\n' "$full"

      - name: Verify migration and remote-locality penalties
        shell: bash
        run: |
          set -euo pipefail
          class=org.flossware.f128x.sim.ContextSweep
          output="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=3 -Df128x.remoteMemoryLatencyPenalty=7 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -q 'migrationLatency=3 remoteMemoryLatencyPenalty=7' <<< "$output"
          grep -Eq 'schedulerMigrations=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteWakeups=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteThreadCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteMemoryIssues=[1-9][0-9]*' <<< "$output"
          grep -Eq 'remoteMemoryLatencyCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'migrationWaiterCycles=[1-9][0-9]*' <<< "$output"
          grep -Eq 'migrationCompletions=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, p, "="); if (p[1]=="schedulerMigrations") migrations=p[2]; if (p[1]=="schedulerSteals") steals=p[2]; if (p[1]=="remoteMemoryIssues") remote=p[2]; if (p[1]=="remoteMemoryLatencyCycles") penalty=p[2]; } } END { if (migrations != steals || penalty != remote * 7) exit 1; }' <<< "$output"
          printf '%s\n' "$output"
          baseline="$(java -Df128x.scheduler=distributed -Df128x.clusters=8 -Df128x.clusterIssueWidth=1 -Df128x.migrationLatency=0 -Df128x.remoteMemoryLatencyPenalty=0 -cp build/scheduler-sim "$class" 64 4 300 0.25 20000 42 2)"
          grep -q 'migrationLatency=0 remoteMemoryLatencyPenalty=0' <<< "$baseline"
          grep -q 'migrationWaiterCycles=0' <<< "$baseline"
          grep -q 'migrationCompletions=0' <<< "$baseline"
          grep -q 'remoteMemoryLatencyCycles=0' <<< "$baseline"
          printf '%s\n' "$baseline"

      - name: Verify memory completion-rate backpressure
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.50 50000 19 4 128 0.70 4 0.20 20 200 1)"
          grep -q 'memoryCompletionRate=1' <<< "$output"
          grep -Eq 'serviceBacklogCycles=[1-9][0-9]*' <<< "$output"
          printf '%s\n' "$output"

      - name: Verify finite queue backpressure
        shell: bash
        run: |
          set -euo pipefail
          output="$(java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 512 4 300 0.50 50000 19 4 8 0.70 4 0.20 20 200)"
          grep -q 'memoryQueueCapacity=8' <<< "$output"
          grep -Eq 'queueFullAttempts=[1-9][0-9]*' <<< "$output"
          awk '{ for (i=1; i<=NF; i++) { split($i, pair, "="); if (pair[1] == "maxQueueOccupancy" && pair[2] > 8) exit 1; } }' <<< "$output"
          printf '%s\n' "$output"

      - name: Verify invalid arguments fail
        shell: bash
        run: |
          set -euo pipefail
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep; then
            echo "Expected invalid invocation to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 1 8 0.70 4 0.20 20 200 1.5 12; then
            echo "Expected invalid dependency fraction to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 1 8 0.70 4 0.20 20 200 0; then
            echo "Expected invalid completion rate to fail" >&2
            exit 1
          fi
          if java -Df128x.hotMemoryFraction=NaN -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected non-finite workspace memory fraction to fail" >&2
            exit 1
          fi
          if java -Df128x.migrationLatency=-1 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected negative migration latency to fail" >&2
            exit 1
          fi
          if java -Df128x.remoteMemoryLatencyPenalty=-1 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected negative remote-memory penalty to fail" >&2
            exit 1
          fi
          if java -Df128x.scheduler=distributed -Df128x.clusters=0 -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 64 4 300 0.25 5000 42; then
            echo "Expected invalid cluster count to fail" >&2
            exit 1
          fi
          if java -cp build/scheduler-sim org.flossware.f128x.sim.ContextSweep 128 2 100 0.25 5000 7 0; then
            echo "Expected max-outstanding=0 to fail" >&2
            exit 1
          fi
